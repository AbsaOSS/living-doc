name: Documentation Task
description: Update or create technical or operational documentation
labels: ["type:documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Provide clear purpose and scope for the documentation update.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the documentation update.
      placeholder: e.g. Add onboarding guide for new microservice
    validations:
      required: true

  - type: textarea
    id: what-must-work
    attributes:
      label: What Must Work
      description: A concrete example - what a reader must be able to do or find once the change is in.
      placeholder: A reader who follows the tutorial gets `technical-project-inner.md` from one workflow run.
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State (If Updating)
      description: Briefly describe existing content or gap.
      placeholder: Existing runbook lacks failure recovery steps.
    validations:
      required: false

  - type: textarea
    id: proposed-changes
    attributes:
      label: Proposed Changes
      description: Key additions, removals, or restructures.
      placeholder: Add section on X; remove deprecated Y.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Numbered outcomes, each checkable against a page. The last one is the canon criterion (CONTRIBUTING.md § Planning ecosystem work).
      placeholder: |
        1. The page states...
        2. Every link in it resolves...
        3. **Canon:** the page agrees with <canon pages and frame rows>, or is the canon page it changes, kept in line with <the pages that depend on it>.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / References
      description: Link related issues, PRs, external standards.
      placeholder: "#123, ADR-7, compliance doc link."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information about the documentation update here.
      placeholder: Add any other relevant context.
    validations:
      required: false
