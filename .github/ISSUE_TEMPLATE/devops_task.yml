name: DevOps Task
description: Issue template for a task about setting up the project. Usually not touching the codebase.
labels: ["scope:devops", "type:operative"]
body:
  - type: markdown
    attributes:
      value: |
        A clear and concise description of the task to be done.

  - type: textarea
    id: task-description
    attributes:
      label: The task
      description: Short description of the task
      placeholder: Describe what needs to be done
    validations:
      required: true

  - type: textarea
    id: canon-check
    attributes:
      label: Canon Check
      description: The acceptance criterion that checks the change against the canon (CONTRIBUTING.md § Planning ecosystem work).
      placeholder: "**Canon:** the change agrees with <canon pages and frame rows>, or updates <canon statement> in <this change or a linked living-doc issue>."
    validations:
      required: true
