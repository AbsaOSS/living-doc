name: "Examples check"

on:
  push:
    branches: [ "master" ]
    paths:
      - "docs/examples/**"
      - "docs/guides/**"
      - "tools/examples_check.py"
      - "tools/test_examples_check.py"
      - "tools/requirements-examples-check.txt"
      - ".github/workflows/examples-check.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "docs/examples/**"
      - "docs/guides/**"
      - "tools/examples_check.py"
      - "tools/test_examples_check.py"
      - "tools/requirements-examples-check.txt"
      - ".github/workflows/examples-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples-check:
    name: Validate docs/examples corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pinned check requirements
        run: pip install -r tools/requirements-examples-check.txt

      - name: Validate the examples corpus
        run: python tools/examples_check.py

      - name: Self-test the validator
        run: python -m pytest tools/test_examples_check.py -q
