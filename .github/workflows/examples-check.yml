name: "Examples check"

on:
  push:
    branches: [ "master" ]
    paths:
      - "docs/examples/**"
      - "docs/guides/**"
      - "docs/reference/**"
      - "tests/examples/**"
      - "tests/docs/**"
      - "tests/integration/**"
      - ".github/workflows/examples-check.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "docs/examples/**"
      - "docs/guides/**"
      - "docs/reference/**"
      - "tests/examples/**"
      - "tests/docs/**"
      - "tests/integration/**"
      - ".github/workflows/examples-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples-check:
    name: Validate docs/examples corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned check requirements
        run: pip install -r tests/examples/requirements-examples-check.txt

      # The corpus, then the authoring guide's before/after pairs against living-doc-utilities'
      # normalisation cases at the installed version's tag (fetched), and docs/reference/errors.md
      # against its code registry.
      - name: Validate the examples corpus, the authoring guide's pairs and the error codes
        run: python tests/examples/examples_check.py

      - name: Self-test the validator
        run: python -m pytest tests/examples/test_examples_check.py -q

      - name: Self-test the living-doc-utilities pin report
        run: python -m pytest tests/examples/test_check_utilities_pins.py -q

      - name: Self-test the snapshot normalizer
        run: python -m pytest tests/examples/test_normalize_snapshot.py -q

      - name: Self-test the retired-names check
        run: python -m pytest tests/docs -q

      # The runner's refusals that need no network; no workflow runs the chain itself.
      - name: Self-test the local integration runner's configuration checks
        run: python -m pytest tests/integration -q
