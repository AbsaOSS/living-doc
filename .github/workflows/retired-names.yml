# Fails when a retired artifact, field or command name comes back in living-doc or in a component at the
# ref tests/collector/collector-pins.env pins it to (tests/docs/retired_names_check.py --strict). No path
# filter: a change anywhere here can bring a name back, and a pin bump brings in a component's files.
# The check's own tests run in examples-check.yml, which has pytest.

name: "Retired names"

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retired-names:
    name: No retired name in living-doc or the pinned components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Clone the pinned components
        run: |
          set -euo pipefail
          # shellcheck source=tests/collector/collector-pins.env
          source tests/collector/collector-pins.env
          clone() {
            local repository="$1" ref="$2" url="https://github.com/AbsaOSS/$1"
            # The pin MUST be an immutable ref: a full 40-hex commit SHA, or a tag that exists on the remote.
            if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]] \
               && ! { [[ -n "$ref" ]] && git ls-remote --tags --exit-code "$url" "refs/tags/$ref" >/dev/null 2>&1; }; then
              echo "::error::The pin of $repository, '$ref', must be a full 40-hex commit SHA or an existing tag of $url."
              exit 2
            fi
            echo "==> $repository @ $ref"
            git clone --quiet --filter=blob:none "$url" "$RUNNER_TEMP/components/$repository"
            git -C "$RUNNER_TEMP/components/$repository" checkout --quiet "$ref"
          }
          clone living-doc-collector-gh "${COLLECTOR_GH_REF:-}"
          clone living-doc-toolkit "${TOOLKIT_REF:-}"
          clone living-doc-generator-markdown "${GENERATOR_MARKDOWN_REF:-}"

      - name: Check for retired names
        run: >-
          python tests/docs/retired_names_check.py --strict
          "$RUNNER_TEMP/components/living-doc-collector-gh"
          "$RUNNER_TEMP/components/living-doc-toolkit"
          "$RUNNER_TEMP/components/living-doc-generator-markdown"
